# kubernetes/15-keyvault-secret-provider.yaml
# REMOVE ALL HARDCODED VALUES AND COMMENTS

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: easyshop-keyvault-secrets
  namespace: easyshop
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "PLACEHOLDER_CLIENT_ID"
    keyvaultName: "PLACEHOLDER_KEYVAULT_NAME"
    tenantId: "PLACEHOLDER_TENANT_ID"
    objects: |
      array:
        - |
          objectName: es-mongodb-username
          objectType: secret
        - |
          objectName: es-mongodb-password
          objectType: secret
        - |
          objectName: es-mongodb-database
          objectType: secret
        - |
          objectName: es-mongodb-uri
          objectType: secret
        - |
          objectName: es-redis-password
          objectType: secret
        - |
          objectName: es-redis-uri
          objectType: secret
  secretObjects:
  - secretName: mongodb-keyvault-secret
    type: Opaque
    data:
    - objectName: es-mongodb-username
      key: username
    - objectName: es-mongodb-password
      key: password
    - objectName: es-mongodb-database
      key: database
    - objectName: es-mongodb-uri
      key: mongodb-uri
  - secretName: redis-keyvault-secret
    type: Opaque
    data:
    - objectName: es-redis-password
      key: password
    - objectName: es-redis-uri
      key: redis-uri

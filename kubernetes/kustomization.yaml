apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: easyshop

resources:
- 01-namespace.yaml
- 04-configmap.yaml
- 05-secrets.yaml
- 08-easyshop-deployment.yaml      # Single deployment file
- 09-easyshop-service.yaml          # Single service
- 15-keyvault-secret-provider.yaml
- 06-mongodb-service.yaml
- 07-mongodb-statefulset.yaml
- 10-ingress.yaml
- 11-hpa.yaml
- 12-migration-job.yaml
- 13-redis-service.yaml
- 14-redis-deployment.yaml
- cert-manager-issuer.yaml
- easyshop-certificate.yaml

# Keep original commonLabels
commonLabels:
  app.kubernetes.io/name: easyshop
  app.kubernetes.io/part-of: easyshop-platform
  app.kubernetes.io/managed-by: kustomize
  environment: production

# Images to update
images:
- name: easyshop
  newTag: latest

# Resource transformations
patches:
- patch: |-
    - op: replace
      path: /spec/volumeClaimTemplates/0/spec/storageClassName
      value: managed-csi
  target:
    kind: StatefulSet
    name: mongodb

# Replica overrides - single deployment
replicas:
- name: easyshop
  count: 2
- name: mongodb
  count: 1
- name: redis
  count: 1
  